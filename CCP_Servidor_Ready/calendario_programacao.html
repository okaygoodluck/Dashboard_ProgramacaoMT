<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calendário da Programação</title>
    <style>
        /* Variáveis CSS para temas */
        :root {
            /* Tema Claro */
            --bg-color: #f8f8f8;
            --text-color: #333;
            --border-color: #ddd;
            --card-bg: #fff;
            --card-shadow: 0 6px 15px rgba(0, 0, 0, 0.15); /* Sombra mais pronunciada */
            --day-hover-bg: #e9e9e9; /* Mais claro */
            --today-border: #3498db;
            --footer-text-color: #777;
            --nav-button-bg: #e0e0e0;
            --nav-button-hover-bg: #d0d0d0;
            --nav-button-text: #333;
        }

        /* Tema Escuro */
        body.dark-mode {
            --bg-color: #242424; /* Fundo mais escuro */
            --text-color: #e0e0e0;
            --border-color: #555;
            --card-bg: #363636; /* Cards mais escuros */
            --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.6); /* Sombra mais escura */
            --day-hover-bg: #4c4c4c;
            --today-border: #80c8ff;
            --footer-text-color: #aaaaaa;
            --nav-button-bg: #4a4a4a;
            --nav-button-hover-bg: #5a5a5a;
            --nav-button-text: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; /* Garante que o body ocupa a altura total da viewport */
            box-sizing: border-box; /* Inclui padding e borda no tamanho total */
        }

        /* Título do Calendário */
        h1 {
            color: var(--text-color);
            margin-bottom: 40px; /* Mais espaço abaixo do título */
            font-size: 2.8em; /* Título maior */
            text-align: center;
            width: 100%;
            padding-top: 20px;
            transition: color 0.3s ease;
        }

        /* Botão de Tema */
        .theme-switcher {
            position: absolute; /* Posicionamento absoluto */
            top: 25px; /* Ajuste para o topo */
            right: 25px; /* Ajuste para a direita */
            padding: 12px 18px; /* Mais padding */
            border: 2px solid var(--border-color); /* Borda mais visível */
            border-radius: 50%; /* Botão circular */
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 1.6em; /* Ícone maior */
            display: flex; /* Para centralizar o ícone */
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: var(--card-shadow);
            line-height: 1; /* Para evitar espaçamento extra em volta do ícone */
        }

        .theme-switcher:hover {
            transform: translateY(-2px); /* Efeito sutil no hover */
            box-shadow: var(--card-shadow); /* Mantém sombra no hover */
        }

        .calendar-container {
            display: flex;
            gap: 50px; /* Espaço maior entre os calendários */
            justify-content: center;
            flex-wrap: wrap; /* Permite quebrar linha em telas menores */
            max-width: 1400px; /* Aumenta ainda mais a largura máxima do contêiner */
            width: 95%; /* Ocupa 95% da largura da tela */
            flex-grow: 1; /* Permite que o contêiner de calendários cresça */
            margin-bottom: 50px; /* Espaço antes do rodapé */
        }

        .month {
            flex: 1;
            min-width: 450px; /* Aumenta a largura mínima de cada mês */
            border: 1px solid var(--border-color);
            border-radius: 15px; /* Bordas mais arredondadas */
            padding: 30px; /* Mais padding interno */
            background-color: var(--card-bg);
            box-shadow: var(--card-shadow);
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex; /* Para organizar cabeçalho, dias da semana e dias */
            flex-direction: column;
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .month-header h2 {
            text-align: center;
            color: var(--text-color);
            margin: 0; /* Remover margens padrão do h2 */
            font-size: 2em; /* Título do mês maior */
            flex-grow: 1; /* Permite que o título ocupe o espaço central */
        }

        /* Espaço para quando um botão não estiver presente */
        .month-header .placeholder {
            width: 100px; /* Largura igual a do botão para manter o h2 centralizado */
        }

        .nav-button {
            background-color: var(--nav-button-bg);
            color: var(--nav-button-text);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100px; /* Fixa a largura do botão para alinhamento */
            text-align: center;
        }

        .nav-button:hover {
            background-color: var(--nav-button-hover-bg);
            transform: translateY(-1px);
        }

        .weekdays {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 20px; /* Mais espaço */
            color: var(--text-color);
            padding: 0 8px; /* Ajuste de padding */
            font-size: 1.2em; /* Dias da semana maiores */
        }

        .weekdays span {
            width: calc(100% / 7);
            text-align: center;
        }

        .days {
            display: flex;
            flex-wrap: wrap;
            gap: 10px; /* Mais espaço entre os dias */
            flex-grow: 1; /* Permite que a grade de dias ocupe o espaço restante */
        }

        .day {
            width: calc(100% / 7 - 10px); /* Ajustado para o novo gap */
            text-align: center;
            padding: 15px 0; /* Mais padding vertical */
            box-sizing: border-box;
            border-radius: 10px; /* Mais arredondado */
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 85px; /* Aumentado significativamente a altura mínima da célula */
            font-size: 1.1em; /* Fonte base dos dias maior */
            position: relative;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); /* Borda interna sutil */
        }
        body.dark-mode .day {
             box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        }

        .day span.date-number {
            font-weight: bold;
            font-size: 1.4em; /* Número do dia ainda maior */
            margin-bottom: 5px;
        }

        .day span.legend {
            font-size: 0.8em; /* Legenda maior */
            line-height: 1.2;
            text-transform: uppercase;
            font-weight: 600;
            padding: 3px 0;
            color: rgba(255, 255, 255, 0.95); /* Cor da legenda mais forte */
            width: 100%;
            white-space: normal;
            word-break: break-word;
        }

        .day:not(.empty):hover {
            background-color: var(--day-hover-bg);
            transform: translateY(-3px); /* Efeito de elevação mais pronunciado */
            box-shadow: var(--card-shadow);
        }

        /* Cores gerais (mantidas ou ajustadas sutilmente) */
        .green-day {
            background-color: #9cdb8f; /* Verde um pouco mais vibrante */
            color: #212121;
        }

        .red-day {
            background-color: #e06c75; /* Vermelho um pouco mais vibrante */
            color: white;
        }

        /* Classes para os limites (alta prioridade) */
        .limit-aprovacao {
            background-color: #d64a38; /* Vermelho escuro forte */
            color: white;
        }

        .limit-avisos {
            background-color: #f7913d; /* Laranja escuro forte */
            color: white;
        }

        .limit-condis {
            background-color: #3f9be6; /* Azul escuro forte */
            color: white;
        }

        /* Feriado */
        .holiday {
            background-color: #ac63e3; /* Roxo vibrante */
            color: white;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(172, 99, 227, 0.6);
        }

        .holiday .legend {
            font-size: 0.75em; /* Legenda de feriado um pouco maior */
        }

        /* Estilo para o dia atual */
        .today {
            border: 4px solid var(--today-border); /* Borda ainda mais grossa */
            background-color: var(--card-bg); /* Mantém o fundo do card para visibilidade da borda */
            color: var(--text-color);
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.8); /* Sombra mais intensa para o dia atual */
            transform: scale(1.02); /* Pequeno zoom para o dia atual */
        }

        /* Para os dias vazios no início do mês */
        .day.empty {
            background-color: transparent;
            border: none;
            cursor: default;
            box-shadow: none; /* Sem sombra para dias vazios */
        }

        .day.empty:hover {
            transform: none;
            background-color: transparent;
        }

        /* Rodapé */
        footer {
            margin-top: auto; /* Empurra o rodapé para o final da página */
            padding-top: 20px;
            text-align: center;
            font-size: 0.9em;
            color: var(--footer-text-color);
            transition: color 0.3s ease;
        }

        /* Responsividade */
        @media (max-width: 1200px) {
            .calendar-container {
                gap: 30px;
                max-width: 90%;
            }
            .month {
                min-width: 380px;
                padding: 25px;
            }
            .day {
                min-height: 80px;
                font-size: 1em;
            }
            .day span.date-number {
                font-size: 1.3em;
            }
        }

        @media (max-width: 992px) { /* Tablets em modo paisagem */
            .month {
                min-width: 320px;
                padding: 20px;
            }
            .day {
                min-height: 75px;
            }
            h1 {
                font-size: 2.2em;
            }
        }

        @media (max-width: 768px) { /* Tablets em modo retrato e celulares */
            body {
                padding: 20px;
            }
            h1 {
                font-size: 1.8em;
                margin-bottom: 30px;
            }
            .theme-switcher {
                top: 15px;
                right: 15px;
                padding: 10px 15px;
                font-size: 1.4em;
            }
            .calendar-container {
                flex-direction: column;
                align-items: center;
                gap: 30px;
                width: 100%; /* Ocupa a largura total (com padding do body) */
                max-width: none; /* Remove a largura máxima */
            }
            .month {
                width: 95%; /* Ocupa quase toda a largura disponível */
                min-width: unset; /* Remove min-width para flexibilidade total */
                padding: 25px;
            }
            .day {
                min-height: 70px;
                font-size: 0.95em;
                padding: 12px 0;
                border-radius: 8px;
            }
            .day span.date-number {
                font-size: 1.2em;
            }
            .day span.legend {
                font-size: 0.7em;
            }
        }

        @media (max-width: 480px) { /* Celulares menores */
            body {
                padding: 15px;
            }
            h1 {
                font-size: 1.5em;
                margin-bottom: 25px;
            }
            .theme-switcher {
                padding: 8px 12px;
                font-size: 1.2em;
            }
            .month {
                padding: 20px;
            }
            .weekdays {
                font-size: 1em;
            }
            .day {
                min-height: 60px;
                padding: 10px 0;
            }
            .day span.date-number {
                font-size: 1.1em;
            }
            .day span.legend {
                font-size: 0.65em;
            }
        }

    </style>
</head>
<body>

    <button class="theme-switcher" id="themeSwitcher">☀️</button>
    <h1>Calendário da Programação</h1>

    <div class="calendar-container">
        <div id="currentMonth" class="month"></div>
        <div id="nextMonth" class="month"></div>
    </div>

    <footer>
        Desenvolvido por Kennedy Vieira c057573
    </footer>

    <script>
        // Feriados de Belo Horizonte para 2025 (Nome, Mês-1, Dia)
        const holidaysBH2025 = [
            { name: "Confraternização Universal", month: 0, day: 1 },
            { name: "Carnaval", month: 2, day: 3 }, // 3 de Março
            { name: "Carnaval (facultativo)", month: 2, day: 4 }, // 4 de Março
            { name: "Quarta-feira de Cinzas", month: 2, day: 5 }, // 5 de Março 
            { name: "Paixão de Cristo", month: 3, day: 18 }, // 18 de Abril
            { name: "Tiradentes", month: 3, day: 21 },//Tiradentes
            { name: "Dia do Trabalhador", month: 4, day: 1 },
            { name: "Dia do Trabalhador", month: 4, day: 2 },//emenda do dia do trabalho
            { name: "Corpus Christi", month: 5, day: 19 }, // 19 de Junho
            { name: "Corpus Christi", month: 5, day: 20 }, // emenda o 19 de Julho
            { name: "Assunção de N. Sra.", month: 7, day: 15 }, // 15 de Agosto (Feriado Municipal BH)
            { name: "Independência do Brasil", month: 8, day: 7 },
            { name: "N. Sra. Aparecida", month: 9, day: 12 },
            { name: "Finados", month: 10, day: 2 },
            { name: "Proclamação da República", month: 10, day: 15 },
            { name: "Consciência Negra", month: 10, day: 20 },
            { name: "Consciência Negra", month: 10, day: 21 },//emenda
            { name: "Feriado Municipal", month: 11, day: 25 },
			{ name: "Natal", month: 11, day: 24 }, // emenda natalina
            { name: "Natal", month: 11, day: 25 },
            { name: "Natal", month: 11, day: 26 }, //Emenda Natalina
			{ name: "Ano novo", month: 11, day: 31 }, //Vespera de ano novo
		
        ];

        // Feriados de Belo Horizonte para 2026 (Nome, Mês-1, Dia)
        const holidaysBH2026 = [
            { name: "Confraternização Universal", month: 0, day: 1 },
             { name: "Confraternização Universal", month: 0, day: 2 },
            { name: "Segunda de Carnaval (facultativo)", month: 1, day: 16 }, // 16 de Fevereiro de 2026
            { name: "Carnaval", month: 1, day: 17 }, // 17 de Fevereiro de 2026
            { name: "Quarta-feira de Cinzas (facultativo até 14h)", month: 1, day: 18 }, // 18 de Fevereiro de 2026
            { name: "Paixão de Cristo", month: 3, day: 3 }, // 3 de Abril de 2026
            { name: "Emenda Tiradentes", month: 3, day: 20 },
            { name: "Tiradentes", month: 3, day: 21 },
            { name: "Dia do Trabalhador", month: 4, day: 1 },
            { name: "Corpus Christi", month: 5, day: 4 }, // 4 de Junho de 2026
            { name: "Assunção de N. Sra.", month: 7, day: 15 }, // 15 de Agosto (Feriado Municipal BH)
            { name: "Independência do Brasil", month: 8, day: 7 },
            { name: "N. Sra. Aparecida", month: 9, day: 12 },
            { name: "Finados", month: 10, day: 2 },
            { name: "Proclamação da República", month: 10, day: 15 },
            { name: "Consciência Negra", month: 10, day: 20 },
            { name: "Natal", month: 11, day: 25 },
            { name: "Ano novo", month: 11, day: 31 }
        ];

        // Variável global para armazenar o mês e ano atualmente exibidos
        
        let now = new Date();
        let currentDisplayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate()); 

        function isHoliday(date) {
            const year = date.getFullYear();
            const holidaysByYear = { 2025: holidaysBH2025, 2026: holidaysBH2026 };
            const list = holidaysByYear[year] || [];
            return list.some(holiday =>
                holiday.month === date.getMonth() &&
                holiday.day === date.getDate()
            );
        }

        function isWeekend(date) {
            const day = date.getDay();
            return day === 0 || day === 6;
        }

        function isBusinessDay(date) {
            return !isWeekend(date) && !isHoliday(date);
        }

        function calculateBusinessDays(start, end) {
            let count = 0;
            const currentDate = new Date(start.getFullYear(), start.getMonth(), start.getDate());
            const endDate = new Date(end.getFullYear(), end.getMonth(), end.getDate());

            if (currentDate > endDate) {
                return -1;
            }

            while (currentDate <= endDate) {
                if (isBusinessDay(currentDate)) {
                    count++;
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return count;
        }

        function addBusinessDays(startDate, daysToAdd) {
            if (daysToAdd < 0) return new Date(startDate);
            let date = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
            let count = 0;

            while (count < daysToAdd) {
                date.setDate(date.getDate() + 1);
                if (isBusinessDay(date)) {
                    count++;
                }
            }
            return date;
        }

        function getConsecutiveNonBusinessDays(startDate) {
            const nonBusinessDays = [];
            let currentDate = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
            currentDate.setDate(currentDate.getDate() + 1); 

            while (!isBusinessDay(currentDate)) {
                nonBusinessDays.push(new Date(currentDate));
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return nonBusinessDays;
        }

        function getMonthCalendar(monthIndex, year) {
            const firstDay = new Date(year, monthIndex, 1);
            const lastDay = new Date(year, monthIndex + 1, 0);
            const calendar = [];

            for (let i = 0; i < firstDay.getDay(); i++) {
                calendar.push(null);
            }

            for (let i = 1; i <= lastDay.getDate(); i++) {
                const dayDate = new Date(year, monthIndex, i);
                calendar.push(dayDate);
            }
            return calendar;
        }

        // NOVO PARÂMETRO: `isLeftCalendar` para controlar qual botão mostrar
        function renderCalendar(containerId, monthDate, isLeftCalendar) {
            const container = document.getElementById(containerId);
            const year = monthDate.getFullYear();
            const monthIndex = monthDate.getMonth();

            // A data para cálculo dos limites deve ser SEMPRE 30/07/2025, conforme o contexto.
            const fixedTodayForLimits = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const calendar = getMonthCalendar(monthIndex, year);
            const weekdays = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            const monthName = new Date(year, monthIndex).toLocaleString('pt-BR', { month: 'long' }).toUpperCase();

            // Lógica para os botões de navegação
            let navButtonsHtml = '';
            if (isLeftCalendar) {
                navButtonsHtml = `
                    <button class="nav-button prev-month" data-month-offset="-1">&lt; Anterior</button>
                    <div class="placeholder"></div> `;
            } else {
                navButtonsHtml = `
                    <div class="placeholder"></div> <button class="nav-button next-month" data-month-offset="1">Próximo &gt;</button>
                `;
            }

            container.innerHTML = `
                <div class="month-header">
                    ${isLeftCalendar ? `<button class="nav-button prev-month" data-month-offset="-1">&lt; Anterior</button>` : `<div class="placeholder"></div>`}
                    <h2>${monthName} ${year}</h2>
                    ${isLeftCalendar ? `<div class="placeholder"></div>` : `<button class="nav-button next-month" data-month-offset="1">Próximo &gt;</button>`}
                </div>
                <div class="weekdays">
                    <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
                </div>
                <div class="days"></div>
            `;
            
            const daysDiv = container.querySelector('.days'); // Seleciona o contêiner dos dias dentro do mês atual

            // Calcula os limites de dias úteis a partir de fixedTodayForLimits
            const approvalLimit = addBusinessDays(fixedTodayForLimits, 11);
            const avisosLimit = addBusinessDays(fixedTodayForLimits, 8);
            const condisLimit = addBusinessDays(fixedTodayForLimits, 2);

            function addLimitMarking(dayElement, limitName, limitClass) {
                dayElement.classList.add(limitClass);
                let legendSpan = dayElement.querySelector('.legend');
                if (!legendSpan) {
                    legendSpan = document.createElement('span');
                    legendSpan.className = 'legend';
                    dayElement.appendChild(legendSpan);
                }
                if (!legendSpan.textContent.includes(limitName)) {
                    if (legendSpan.textContent) {
                        legendSpan.textContent += ` / ${limitName}`;
                    } else {
                        legendSpan.textContent = limitName;
                    }
                }
            }

            calendar.forEach((date) => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';

                if (!date) {
                    dayDiv.classList.add('empty');
                } else {
                    const dateNumberSpan = document.createElement('span');
                    dateNumberSpan.className = 'date-number';
                    dateNumberSpan.textContent = date.getDate();
                    dayDiv.appendChild(dateNumberSpan);

                    // Verifica se é o dia atual (do usuário, que é 30/07/2025)
                    const actualTodayStripped = new Date(now.getFullYear(), now.getMonth(), now.getDate()); 
                    if (date.getTime() === actualTodayStripped.getTime()) {
                        dayDiv.classList.add('today');
                    }

                    const holidayInfo = (() => {
                        const y = date.getFullYear();
                        const map = { 2025: holidaysBH2025, 2026: holidaysBH2026 };
                        const list = map[y] || [];
                        return list.find(holiday =>
                            holiday.month === date.getMonth() &&
                            holiday.day === date.getDate()
                        );
                    })();
                    if (holidayInfo) {
                        dayDiv.classList.add('holiday');
                        const legendSpan = document.createElement('span');
                        legendSpan.className = 'legend';
                        legendSpan.textContent = holidayInfo.name;
                        dayDiv.appendChild(legendSpan);
                    }

                    // Cálculo dos dias úteis entre fixedTodayForLimits e a data do calendário
                    if (date >= fixedTodayForLimits) {
                        const diffInBusinessDaysFromFixedToday = calculateBusinessDays(fixedTodayForLimits, date);
                        if (diffInBusinessDaysFromFixedToday >= 0 && diffInBusinessDaysFromFixedToday <= 11) {
                            dayDiv.classList.add('red-day');
                        } else if (diffInBusinessDaysFromFixedToday > 11) {
                            dayDiv.classList.add('green-day');
                        }
                    }
                    
                    const consecutiveNonBusinessDaysApproval = getConsecutiveNonBusinessDays(approvalLimit);
                    const consecutiveNonBusinessDaysAvisos = getConsecutiveNonBusinessDays(avisosLimit);
                    const consecutiveNonBusinessDaysCondis = getConsecutiveNonBusinessDays(condisLimit);

                    if (date.getTime() === approvalLimit.getTime() ||
                        consecutiveNonBusinessDaysApproval.some(d => d.getTime() === date.getTime())) {
                        addLimitMarking(dayDiv, 'Aprovação', 'limit-aprovacao');
                    }
                    if (date.getTime() === avisosLimit.getTime() ||
                        consecutiveNonBusinessDaysAvisos.some(d => d.getTime() === date.getTime())) {
                        addLimitMarking(dayDiv, 'Avisos', 'limit-avisos');
                    }
                    if (date.getTime() === condisLimit.getTime() ||
                        consecutiveNonBusinessDaysCondis.some(d => d.getTime() === date.getTime())) {
                        addLimitMarking(dayDiv, 'Condis', 'limit-condis');
                    }
                }
                
                // Verifica conflitos de legendas/cores e aplica um gradiente
                const statusColors = {
                    'limit-aprovacao': '#d64a38',
                    'limit-avisos': '#f7913d',
                    'limit-condis': '#3f9be6',
                    'holiday': '#ac63e3'
                };

                const appliedColors = [];
                for (const [cls, color] of Object.entries(statusColors)) {
                    if (dayDiv.classList.contains(cls)) {
                        appliedColors.push(color);
                    }
                }

                if (appliedColors.length > 1) {
                    let gradientStops = [];
                    let step = 100 / appliedColors.length;
                    appliedColors.forEach((color, index) => {
                        let start = index * step;
                        let end = (index + 1) * step;
                        gradientStops.push(`${color} ${start}%`);
                        gradientStops.push(`${color} ${end}%`);
                    });
                    dayDiv.style.background = `linear-gradient(135deg, ${gradientStops.join(', ')})`;
                    dayDiv.style.color = 'white';
                }

                daysDiv.appendChild(dayDiv);
            });
        }

        // Função para atualizar os calendários exibidos
        function updateCalendars() {
            // Renderiza o mês atual (calendário da esquerda)
            renderCalendar('currentMonth', currentDisplayDate, true); // Passa true para indicar que é o calendário da esquerda

            // Calcula o próximo mês
            const nextMonthDate = new Date(currentDisplayDate.getFullYear(), currentDisplayDate.getMonth() + 1, 1);
            // Renderiza o próximo mês (calendário da direita)
            renderCalendar('nextMonth', nextMonthDate, false); // Passa false para indicar que é o calendário da direita

            // Adiciona event listeners aos botões de navegação APÓS renderizar.
            document.querySelectorAll('.nav-button').forEach(button => {
                button.addEventListener('click', (event) => {
                    const offset = parseInt(event.target.dataset.monthOffset);
                    currentDisplayDate.setMonth(currentDisplayDate.getMonth() + offset);
                    updateCalendars(); // Chama para re-renderizar com o novo mês
                });
            });
        }


        // Lógica para o modo claro/escuro
        const themeSwitcher = document.getElementById('themeSwitcher');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeSwitcher.textContent = '🌙';
        } else {
            themeSwitcher.textContent = '☀️';
        }

        themeSwitcher.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                themeSwitcher.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                themeSwitcher.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        });

        // Inicializa os calendários na carga da página
        updateCalendars();

    </script>

</body>
</html>
