name: Gerar Release Portátil (CCP_Versao_Rede)

on:
  push:
    tags:
      - 'v*' # Dispara em tags como v1.0.0, v1.5.2, etc.
  workflow_dispatch: # Permite disparar manualmente pela interface do GitHub

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para criar a release e subir assets

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar Python Portátil (Windows Embeddable)
        run: |
          if [ ! -f "CCP_Versao_Rede/python/python.exe" ]; then
            echo "Interpretador Python não encontrado. Preparando versão portátil para a release..."
            mkdir -p CCP_Versao_Rede/python
            curl -L https://www.python.org/ftp/python/3.14.3/python-3.14.3-embed-amd64.zip -o python_portable.zip
            unzip python_portable.zip -d CCP_Versao_Rede/python
            
            # Configura o arquivo ._pth de forma infalível usando Heredoc
            # Isso garante que as quebras de linha sejam reais e o Python encontre o zip
            echo "python314.zip" > CCP_Versao_Rede/python/python314._pth
            echo "." >> CCP_Versao_Rede/python/python314._pth
            echo "Lib" >> CCP_Versao_Rede/python/python314._pth
            echo "Lib/site-packages" >> CCP_Versao_Rede/python/python314._pth
            echo "import site" >> CCP_Versao_Rede/python/python314._pth
            
            # Garante que as pastas de bibliotecas existam para o PIP
            mkdir -p CCP_Versao_Rede/python/Lib/site-packages
            
            echo "Python portátil configurado com sucesso."
            
            # Baixa o get-pip.py para facilitar a instalação de dependências pelo usuário
            curl -L https://bootstrap.pypa.io/get-pip.py -o CCP_Versao_Rede/python/get-pip.py
            echo "Python portátil configurado."
          else
            echo "Pasta python já existe no repositório. Usando versão local."
          fi

      - name: Criar Pacote ZIP
        run: |
          zip -r CCP_Portable.zip CCP_Versao_Rede/
          
      - name: Criar Release e Upload do Asset
        uses: softprops/action-gh-release@v2
        with:
          files: CCP_Portable.zip
          name: "Vanguard Command Center - Release ${{ github.ref_name }}"
          body: |
            ## 🚀 Vanguard Portable (CCP_Versao_Rede)
            
            Esta release contém a versão atualizada da pasta de rede para uso em Home Office.
            
            ### 📝 Instruções:
            1. Baixe o arquivo `CCP_Portable.zip`.
            2. Extraia o conteúdo no seu **C:\ (Desktop ou Documentos)** local.
            3. Execute o `INSTALAR_DEPENDENCIAS_PORTABLE.bat` para configurar o ambiente.
            4. Abra o Dashboard pelo `ACESSAR_DASHBOARD.bat`.
            
            *Nota: Não execute diretamente da unidade de rede para evitar lentidão.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
