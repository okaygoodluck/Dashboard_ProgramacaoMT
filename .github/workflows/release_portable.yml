name: Gerar Release Portátil (CCP_Versao_Rede)

on:
  push:
    tags:
      - 'v*' # Dispara em tags como v1.0.0, v1.5.2, etc.
  workflow_dispatch: # Permite disparar manualmente pela interface do GitHub

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para criar a release e subir assets

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Gerar Pasta Portatil (CCP_Versao_Rede)
        run: |
          python3 scripts/build_portable.py

      - name: Criar Pacote ZIP
        run: |
          zip -r CCP_Portable.zip CCP_Versao_Rede/
          
      - name: Criar Release e Upload do Asset
        uses: softprops/action-gh-release@v2
        with:
          files: CCP_Portable.zip
          name: "Vanguard - Release ${{ github.ref_name }}"
          body: |
            ## 🚀 Vanguard Portable (CCP)
            
            Versão automatizada e isolada do sistema.
            
            ### 📝 Instruções Rápidas:
            1. Baixe e extraia o `CCP_Portable.zip` no seu **C:\ (Desktop)**.
            2. Entre na pasta `CCP_Versao_Rede`.
            3. Execute `INSTALAR_DEPENDENCIAS_PORTABLE.bat` (apenas na primeira vez).
            4. Abra o Dashboard pelo `Iniciar_Vanguard.bat`.
            
            *Atenção: Não é necessário ter Python instalado no seu PC.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
